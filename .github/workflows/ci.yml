name: TinyGame CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-and-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install firmware build tools
        run: python -m pip install platformio
      - name: Run host tests
        run: python tools/tg.py test
      - name: Build WebAssembly simulator
        run: python tools/tg.py sim --build-only
      - name: Test WebAssembly engine and storage
        run: node sim/arduino/test_engine.mjs
      - name: Build and test 1.69 WebAssembly profile
        run: |
          python tools/tg.py sim --build-only --board 169
          node sim/arduino/test_engine_169.mjs
      - name: Compare native and WebAssembly engine traces
        run: python tools/check_engine_traces.py

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [147b, 169]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install firmware build tools
        run: python -m pip install platformio
      - name: Build application firmware
        run: python tools/tg.py build --board "${{ matrix.board }}"
      - name: Build hardware test card
        run: python tools/tg.py test-card-build --board "${{ matrix.board }}"
