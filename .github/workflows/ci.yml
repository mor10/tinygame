name: CI
on:
  push:
    branches: [v2, 'v2-**']
  pull_request:
    branches: [v2, 'v2-**']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify (checks, tests, golden frames, game steps)
        run: python3 tools/tg.py verify
      - name: Render test cards and demo frames
        run: python3 tools/tg.py testcard && python3 tools/tg.py demo
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: |
            out/testcard/*.png
            out/demo/*.png
