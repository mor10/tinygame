name: CI
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine host tests
        run: python3 tools/tg.py test
      - name: Render test cards
        run: python3 tools/tg.py testcard
      - uses: actions/upload-artifact@v4
        with:
          name: testcard
          path: out/testcard/*.png
