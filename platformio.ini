; TinyGame firmware and isolated dual-board hardware test-card targets.

[platformio]
default_envs = esp32-s3-lcd-147b

[env]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Waveshare board memory configuration
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/tinygame_16mb.csv
board_build.arduino.memory_type = qio_opi

build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1

build_flags =
    -std=gnu++17
    ; TinyUSB CDC tracks host open/close (DTR); hardware CDC latches until unplug.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src/hal
    -I src/os

; Game unit tests run on the computer (python3 tools/tg.py test), not the board.
build_src_filter = +<*> -<games/*/test/>

lib_deps =
    lvgl/lvgl@9.6.0

extra_scripts =
    pre:tools/pio_lua.py

; The ST7789 display port follows Waveshare's verified SPI initialization.

[env:esp32-s3-lcd-147b]
build_flags = ${env.build_flags} -DTG_BOARD=147

[env:esp32-s3-lcd-169]
build_flags = ${env.build_flags} -DTG_BOARD=169

[env:test-card-147b]
build_flags = ${env.build_flags} -DTG_BOARD=147 -DTG_TEST_CARD
build_src_filter =
    +<main.cpp>
    +<diagnostics/test_card.cpp>
    +<hal/display.cpp>
    +<hal/input.cpp>
    +<hal/imu.cpp>
    +<hal/power.cpp>
    +<os/style.cpp>

[env:test-card-169]
build_flags = ${env.build_flags} -DTG_BOARD=169 -DTG_TEST_CARD
build_src_filter =
    +<main.cpp>
    +<diagnostics/test_card.cpp>
    +<hal/display.cpp>
    +<hal/input.cpp>
    +<hal/imu.cpp>
    +<hal/power.cpp>
    +<os/style.cpp>
