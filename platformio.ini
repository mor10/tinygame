; TinyGame v2 console firmware.
; Board A: Waveshare ESP32-S3-LCD-1.47B, ESP32-S3R8, 16 MB flash, 8 MB PSRAM,
; ST7789 172x320. Platform, board and memory settings are v1.0's, unchanged.
;
; Adding Board B: add a [env:board_b] that extends [firmware_common], defines
; -DTG_BOARD_B, and add hal/boards/board_b/. See hal/board.h.

[platformio]
; The project root is the source root, so one filter can pick up firmware/, hal/,
; os/ and the portable engine/ together.
src_dir = .
default_envs = board_a

[firmware_common]
platform = espressif32 @ 6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; TinyUSB CDC tracks host open/close (DTR); hardware CDC latches until unplug.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -I hal
    -I os
    ; Vendored Lua, built with 32-bit numbers (docs/decisions/0009).
    -DLUA_32BITS=1
    -I third_party/lua/src

; What is compiled. Host tests and host programs are not firmware.
build_src_filter =
    -<*>
    +<firmware/>
    +<hal/>
    +<os/>
    +<engine/>
    +<third_party/lua/src/>
    -<engine/test/>
    -<engine/host/>
    -<hal/test/>
    -<os/test/>

[env:board_a]
extends = firmware_common
board = esp32-s3-devkitc-1

; Waveshare board memory configuration (v1.0)
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    ${firmware_common.build_flags}
    -DTG_BOARD_A
