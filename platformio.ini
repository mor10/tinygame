; TinyGame console firmware for the Waveshare ESP32-S3-LCD-1.47B
; ESP32-S3R8, 16 MB flash, 8 MB PSRAM, ST7789 172x320

[env:esp32-s3-lcd-147b]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Waveshare board memory configuration
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src/hal
    -I src/os

; Game unit tests run on the computer (python3 tools/tg.py test), not the board.
build_src_filter = +<*> -<games/*/test/>

lib_deps =
    lvgl/lvgl@9.6.0

; The ST7789 display port follows Waveshare's verified SPI initialization.
